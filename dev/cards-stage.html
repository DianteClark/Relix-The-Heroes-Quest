  { cls: 'c-hero', th: 'hall', name: 'Luke', tag: 'KNIGHT', art: 'luke', atk: 1, hp: 80, max: 80, rules: '<b>4 / 5 / 6</b>: reduce damage taken this roll by <b>2 / 3 / 5</b>.', corner: '<span class="corner">HERO</span><span class="pips"><i></i><i></i><i></i><i class="on"></i><i class="on"></i><i class="on"></i></span>', cap: 'Hero' },
  { cls: 'c-boss boss', th: 'hive', name: 'Vore', tag: 'BOSS', art: 'vore', atk: 2, hp: 25, max: 25, rules: '<b>Every 3rd roll</b>: hurls the active player out to the nearest trap.', corner: '<span class="corner red">FLOOR 2</span>', cap: 'Boss' },
  { cls: 'c-treasure', th: 'vault', name: 'Super Potion', svg: POTION, when: ['TURN', 'BATTLE', 'PVP'], rules: '<p class="big">Heal 10 health.</p>', corner: '<span class="corner">TREASURE</span>', cap: 'Treasure' },
  { cls: 'c-trap legend foil', th: 'abyss', name: 'Endless Pit', svg: PIT, rules: '<p class="big">You die.</p>', corner: '<span class="corner leg">LEGENDARY</span>', cap: 'Legendary trap (1 copy)' },
];
const rnd = (a, b) => a + Math.random() * (b - a);
document.getElementById('row').innerHTML = CARDS.map((c) => {
  const body = c.hp != null
    ? `<div class="hp"><img src="../assets/ui/heart.webp" alt=""><div class="bar" style="--tick:${100 / Math.min(c.max, 20)}%"><i class="fill"></i><i class="ticks"></i><i class="gloss"></i></div><span class="num">${c.hp}</span></div>`
    : `<div class="when">${(c.when || ['TRAP · ON LANDING']).map((w) => `<i>${w}</i>`).join('')}</div>`;
  return `<div class="slot"><div class="card ${c.cls}">
    <div class="stage"><canvas data-th="${c.th}"></canvas><div class="rays"></div>
      <div class="motes">${Array.from({ length: 10 }, () => `<i style="--x:${rnd(8, 92)}%;--s:${rnd(0.7, 1.5)}cqw;--t:${rnd(3, 6)}s;--d:${rnd(-6, 0)}s;--dx:${rnd(-8, 8)}cqw"></i>`).join('')}</div>
      <div class="plat"><div class="glow"></div><div class="top"></div></div>
      <div class="fig">${c.svg || `<img src="../assets/chars/${c.art}.webp" alt="">`}</div>${c.corner}</div>
    <div class="plate"><div class="nm"><b class="${c.name.length > 9 ? 'sm' : ''}">${c.name}</b>${c.tag ? `<em>${c.tag}</em>` : ''}</div>
      ${c.atk != null ? `<div class="atk"><img src="../assets/ui/sword.webp" alt="">${c.atk}</div>` : ''}${body}</div>
    <div class="rules">${c.rules.startsWith('<p') ? c.rules : `<p>${c.rules}</p>`}</div>
  </div><div class="cap">${c.cap}</div></div>`;
}).join('');
document.querySelectorAll('canvas[data-th]').forEach((cv) => paint(cv, THEMES[cv.dataset.th]));
document.querySelectorAll('.card').forEach((card) => {
  const move = (e) => { const r = card.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5; card.style.transform = `rotateY(${x * 18}deg) rotateX(${-y * 18}deg) scale(1.03)`; };
  const reset = () => { card.style.transform = ''; };
  card.addEventListener('pointermove', move); card.addEventListener('pointerdown', move);
  ['pointerleave', 'pointerup', 'pointercancel'].forEach((t) => card.addEventListener(t, reset));
});
</script>
</body>
</html>
